name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.4"

jobs:
  quality:
    name: lint, typecheck, Go vet and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: shim/go.mod
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Go vet and tests
        working-directory: shim
        run: |
          go vet ./...
          go test -count=1 ./...
      - name: Linux sandbox helper (vet, tests, cross-compile; it is not run)
        working-directory: helpers/linux-sandbox
        run: |
          go vet ./...
          go test -count=1 ./...
          GOOS=linux GOARCH=amd64 go vet ./...
          GOOS=linux GOARCH=arm64 go vet ./...
      - name: Build binaries (sieve and sieve-hook)
        run: bun run build
      - name: Test (slices 1–3)
        run: bun test

  offline:
    name: zero network calls by default (Linux network namespace)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: shim/go.mod
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Dependencies are installed and binaries built above; the tests then run in an empty network
      # namespace, so any outbound call fails the test instead of passing. Only loopback is brought up:
      # several tests host a local server (the proxy, the dashboard, the sandbox and behaviour tests), and
      # a new namespace leaves `lo` down, which made them fail with "Failed to start server". There is no
      # route out of the namespace, and the next step proves it.
      - name: Tests with networking off (loopback only)
        run: |
          BUN="$(command -v bun)"
          sudo env "PATH=$PATH" unshare -n -- sh -c 'ip link set lo up && exec "$1" test' sh "$BUN"
      - name: The namespace really has no route out
        run: |
          sudo unshare -n -- sh -c 'ip link set lo up; if ping -c1 -W1 1.1.1.1 >/dev/null 2>&1; then echo "network reachable"; exit 1; else echo "no route out: network is off"; fi'

  macos:
    name: tests on macOS (FSEvents watcher, /var and /tmp symlinks)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: shim/go.mod
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Test
        run: bun test
      - name: Shim tests
        working-directory: shim
        run: go test -count=1 ./...

  bench:
    name: replay benchmark gate (real output)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # Deterministic: fails if any must-keep fact is lost on any real output.
      - run: bun packages/bench/src/main.ts replay

  windows-build:
    name: Windows shim builds (no tests yet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: shim/go.mod
      # The Windows daemon transport (named pipe) is not built yet, so only the shim is checked.
      - working-directory: shim
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null .

  sandbox-linux:
    name: sandbox on Linux (bubblewrap) -- NOT YET RUN
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: shim/go.mod
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Install bubblewrap and allow unprivileged user namespaces
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          # Ubuntu 24.04 runners restrict unprivileged user namespaces through AppArmor.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --unshare-net /bin/true && echo "bwrap works"
      # The sandbox tests skip, saying so, where no backend works; here one must.
      - name: Sandbox tests (a real backend is required)
        run: |
          bun scripts/require-sandbox.ts bwrap
          bun test packages/sandbox packages/daemon/test/sandbox.test.ts
